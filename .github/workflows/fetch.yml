name: fetch-cistarget

# 手动触发：到仓库的 Actions 页面点 Run workflow
on:
  workflow_dispatch:

# 需要写权限才能创建 Release
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # 第一步：先列出两个目录，确认文件名和可用版本（跑失败时靠这个排查）
      - name: 探测可用文件
        run: |
          echo "=========== motif2tf 目录 ==========="
          curl -sSL --max-time 60 https://resources.aertslab.org/cistarget/motif2tf/ || echo "目录列出失败"
          echo ""
          echo "=========== gene_based 目录 ==========="
          curl -sSL --max-time 60 https://resources.aertslab.org/cistarget/databases/homo_sapiens/hg38/refseq_r80/mc_v10_clust/gene_based/ || echo "目录列出失败"

      # 第二步：下载基序-转录因子注释表（很小，几 MB）
      - name: 下载基序注释表
        run: |
          curl -fL --retry 3 --retry-delay 5 -o motifAnnotations_hgnc_v9.tbl \
            https://resources.aertslab.org/cistarget/motif2tf/motifAnnotations_hgnc_v9.tbl \
            && echo "v9 注释表下载成功" || echo "v9 注释表下载失败"
          curl -fL --retry 3 --retry-delay 5 -o motifAnnotations_hgnc_v10.tbl \
            https://resources.aertslab.org/cistarget/motif2tf/motifAnnotations_hgnc_v10.tbl \
            && echo "v10 注释表下载成功" || echo "v10 注释表不存在，跳过"

      # 第三步：下载基序排名数据库（约 1 GB，最耗时）
      - name: 下载基序排名数据库
        run: |
          curl -fL --retry 3 --retry-delay 10 --connect-timeout 60 \
            -o hg38_10kbp_up_10kbp_down_full_tx_v10_clust.genes_vs_motifs.rankings.feather \
            https://resources.aertslab.org/cistarget/databases/homo_sapiens/hg38/refseq_r80/mc_v10_clust/gene_based/hg38_10kbp_up_10kbp_down_full_tx_v10_clust.genes_vs_motifs.rankings.feather
          echo "数据库下载完成"

      # 第四步：看看到底下到了什么、多大
      - name: 检查下载结果
        run: |
          echo "=========== 下载结果 ==========="
          ls -lh
          echo ""
          echo "=========== 文件类型 ==========="
          file *.tbl *.feather 2>/dev/null || true

      # 第五步：发布成 Release，方便从国内下载
      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cistarget-v1
          name: cisTarget 基序库
          body: |
            由 GitHub Actions 从 resources.aertslab.org 下载并转存。
            用于 SCENIC / pySCENIC 的基序富集分析。
          fail_on_unmatched_files: false
          files: |
            *.tbl
            *.feather
