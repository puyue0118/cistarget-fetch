name: fetch-cistarget

# 手动触发：到仓库的 Actions 页面点 Run workflow
on:
  workflow_dispatch:

# 需要写权限才能创建 Release
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # 第一步：先列出两个目录，确认文件名和可用版本（跑失败时靠这个排查）
      - name: 探测可用文件
        run: |
          echo "=========== motif2tf 目录 ==========="
          curl -sSL --max-time 60 https://resources.aertslab.org/cistarget/motif2tf/ || echo "目录列出失败"
          echo ""
          echo "=========== gene_based 目录 ==========="
          curl -sSL --max-time 60 https://resources.aertslab.org/cistarget/databases/homo_sapiens/hg38/refseq_r80/mc_v10_clust/gene_based/ || echo "目录列出失败"

      # 第二步：下载基序-转录因子注释表
      # 文件名不是旧的 motifAnnotations_hgnc_v9.tbl；
      # v10_clust 基序库配套的是 motifs-v10nr_clust-nr.hgnc-m0.001-o0.0.tbl
      - name: 下载基序注释表
        run: |
          curl -fL --retry 3 --retry-delay 5 -o motifs-v10nr_clust-nr.hgnc-m0.001-o0.0.tbl \
            https://resources.aertslab.org/cistarget/motif2tf/motifs-v10nr_clust-nr.hgnc-m0.001-o0.0.tbl
          ls -lh *.tbl

      # 第三步：下载基序排名数据库（约 300 MB）以及官方 sha1 校验文件
      - name: 下载基序排名数据库
        run: |
          curl -fL --retry 3 --retry-delay 10 --connect-timeout 60 \
            -o hg38_10kbp_up_10kbp_down_full_tx_v10_clust.genes_vs_motifs.rankings.feather \
            https://resources.aertslab.org/cistarget/databases/homo_sapiens/hg38/refseq_r80/mc_v10_clust/gene_based/hg38_10kbp_up_10kbp_down_full_tx_v10_clust.genes_vs_motifs.rankings.feather
          curl -fL --retry 3 --retry-delay 5 \
            -o hg38_10kbp_up_10kbp_down_full_tx_v10_clust.genes_vs_motifs.rankings.feather.sha1sum.txt \
            https://resources.aertslab.org/cistarget/databases/homo_sapiens/hg38/refseq_r80/mc_v10_clust/gene_based/hg38_10kbp_up_10kbp_down_full_tx_v10_clust.genes_vs_motifs.rankings.feather.sha1sum.txt
          echo "数据库下载完成"

      # 第四步：核对校验和 + 看看到底下到了什么、多大
      - name: 检查下载结果
        run: |
          echo "=========== 官方校验文件 ==========="
          cat *.sha1sum.txt || true
          echo ""
          echo "=========== 实际校验值 ==========="
          sha1sum *.feather || true
          echo ""
          echo "=========== 校验对比 ==========="
          sha1sum -c *.sha1sum.txt || echo "校验不一致，请看上面两段对比"
          echo ""
          ls -lh

      # 第五步：发布成 Release，方便从国内下载
      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cistarget-v2
          name: cisTarget 基序库
          body: |
            由 GitHub Actions 从 resources.aertslab.org 下载并转存。
            用于 SCENIC / pySCENIC 的基序富集分析。
          fail_on_unmatched_files: false
          files: |
            *.tbl
            *.feather
            *.sha1sum.txt
